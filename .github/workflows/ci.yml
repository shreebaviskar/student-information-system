name: Student Information System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          test -s Dockerfile
          test -s nginx.conf
          test -s Jenkinsfile
          echo "All required files are present!"

      - name: Build Docker image
        run: docker build -t student-information-system:ci .

      - name: Verify build
        run: docker image inspect student-information-system:ci
