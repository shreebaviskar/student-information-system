server {
    listen 80;
    server_name localhost;

    # Set root web directory
    root /usr/share/nginx/html;
    index index.html;

    # Charset
    charset utf-8;

    # Security Headers for safe academic & production hosting
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for fast delivery of static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Serve static assets and fallback to index.html for Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static file caching for CSS, JS, and media
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, no-transform";
        try_files $uri =404;
    }

    # Custom error handling
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
